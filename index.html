<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>平铺正向 VR 视频播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
    }
    .interactive { pointer-events: auto; }
    
    .btn {
      background: rgba(30, 30, 30, 0.8); color: #fff; padding: 8px 16px;
      border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.3); font-size: 13px;
      cursor: pointer; backdrop-filter: blur(5px);
    }

    #top-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    #bottom-bar {
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 20px;
      color: #fff; font-size: 12px; display: flex; justify-content: space-between; align-items: center;
    }
  </style>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="top-bar">
      <label class="btn interactive">
        选择MP4
        <input type="file" id="video-file" accept="video/*" style="display:none;">
      </label>
      <button id="play-btn" class="btn interactive">播放</button>
      <button id="sensor-btn" class="btn interactive">启用陀螺仪</button>
      <button id="reset-btn" class="btn interactive">居中视角</button>
    </div>

    <div id="bottom-bar">
      <span id="status">状态: 请选择本地 MP4 视频</span>
    </div>
  </div>

  <div id="canvas-container"></div>
  <video id="video" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

  <script>
    const video = document.getElementById('video');
    const fileInput = document.getElementById('video-file');
    const playBtn = document.getElementById('play-btn');
    const sensorBtn = document.getElementById('sensor-btn');
    const resetBtn = document.getElementById('reset-btn');
    const statusText = document.getElementById('status');

    // 1. 初始化 Scene & Camera
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // 60度 FOV，避免视角拉伸过猛
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. 贴图与几何体纠正（正向 + 放大平铺）
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    // 创建平铺微曲面巨幕 (半径 12，弧度适当放平)
    const geometry = new THREE.SphereGeometry(12, 64, 32, Math.PI * 0.25, Math.PI * 0.5, Math.PI * 0.2, Math.PI * 0.6);
    
    // 内侧可见
    geometry.scale(-1, 1, 1);

    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);

    // 【关键纠正】：翻转 180 度矫正画面颠倒，并调整正面居中
    mesh.rotation.z = Math.PI; 
    mesh.rotation.y = Math.PI / 2;
    scene.add(mesh);

    camera.position.set(0, 0, 0);

    // 3. 视角拖拽与陀螺仪
    let lon = 0, lat = 0;
    let startX = 0, startY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lon -= deltaX * 0.2;
        lat += deltaY * 0.2;
        lat = Math.max(-60, Math.min(60, lat));
      }
    });

    // 重置视角居中
    resetBtn.addEventListener('click', () => {
      lon = 0;
      lat = 0;
      camera.rotation.set(0, 0, 0);
    });

    // 启用陀螺仪
    sensorBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusText.textContent = '状态: 陀螺仪已连接';
          }
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusText.textContent = '状态: 陀螺仪已连接';
      }
    });

    function handleOrientation(event) {
      if (event.alpha !== null) {
        const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
        const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
        const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
        camera.rotation.set(beta, alpha, -gamma, 'YXZ');
      }
    }

    // 4. 视频播放
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        video.play();
        playBtn.textContent = '暂停';
        statusText.textContent = '状态: 正在播放 ' + file.name;
      }
    });

    playBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
        playBtn.textContent = '暂停';
      } else {
        video.pause();
        playBtn.textContent = '播放';
      }
    });

    // 渲染循环
    function animate() {
      requestAnimationFrame(animate);
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

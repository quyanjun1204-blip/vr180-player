<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>180° 第一视角 VR 播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* 前端控制界面 */
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
    }
    .interactive { pointer-events: auto; }
    
    .btn-label {
      background: rgba(20, 20, 20, 0.75); color: #fff; padding: 10px 18px;
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.25); font-size: 13px;
      backdrop-filter: blur(8px); display: inline-block; cursor: pointer;
    }

    #controls {
      background: rgba(20, 20, 20, 0.75); padding: 10px 20px; border-radius: 25px;
      display: flex; align-items: center; justify-content: space-between; color: #fff;
      backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #play-btn { background: none; border: none; color: #fff; font-size: 15px; cursor: pointer; font-weight: bold; }
    
    #sensor-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #007aff; color: white; border: none; padding: 14px 28px;
      border-radius: 30px; font-size: 15px; font-weight: bold; z-index: 20;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); cursor: pointer;
    }

    /* 沉浸感调节调焦提示 */
    #fov-hint {
      position: absolute; top: 60px; right: 15px;
      background: rgba(0,0,0,0.5); color: #ccc; font-size: 11px;
      padding: 6px 10px; border-radius: 12px; backdrop-filter: blur(4px);
    }
  </style>
  <!-- 引入 Three.js 引擎 (极速 CDN) -->
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="sensor-btn" class="interactive">开启陀螺仪 / 第一视角</button>

  <div id="ui">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <label class="btn-label interactive">
         选择 MP4 视频
        <input type="file" id="video-file" accept="video/*" style="display:none;">
      </label>
      <div id="fov-hint"> 双指捏合可调节拉近/远</div>
    </div>

    <div id="controls" class="interactive">
      <button id="play-btn">▶ 播放</button>
      <span id="file-name" style="font-size:12px; opacity:0.8; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">未选择视频</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <video id="video" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

  <script>
    const video = document.getElementById('video');
    const fileInput = document.getElementById('video-file');
    const playBtn = document.getElementById('play-btn');
    const fileName = document.getElementById('file-name');
    const sensorBtn = document.getElementById('sensor-btn');

    // 1. 初始化 3D 引擎与相机
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // 透视相机设置：85度 FOV 贴近人类人眼第一视角自然视场
    const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. 创建防扁平的 180 度第一视角半球体 (180 Dome Geometry)
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.format = THREE.RGBAFormat;

    // 参数分析：半径 10，经线切片 64，纬线切片 32，经度范围 Math.PI (即180度)
    const geometry = new THREE.SphereGeometry(10, 64, 32, Math.PI / 2, Math.PI, 0, Math.PI);
    
    // 翻转几何体让纹理贴在半球内侧（人站在球心往外看）
    geometry.scale(-1, 1, 1);

    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
    const domeMesh = new THREE.Mesh(geometry, material);
    
    // 旋转半球使正面朝向摄像机
    domeMesh.rotation.y = -Math.PI / 2;
    scene.add(domeMesh);

    camera.position.set(0, 0, 0.1); // 相机置于第一视角球心

    // 3. 视角控制（触摸拖拽 + 陀螺仪 + 双指缩放）
    let lon = 0, lat = 0;
    let startX = 0, startY = 0;
    let touchDistance = 0;

    // 滑动控制
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        // 双指捏合计算
        touchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lon -= deltaX * 0.25;
        lat += deltaY * 0.25;
        lat = Math.max(-80, Math.min(80, lat));
      } else if (e.touches.length === 2) {
        // 调节视场角 FOV（防止人物太近或太远拉伸）
        const newDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = touchDistance / newDist;
        touchDistance = newDist;
        camera.fov = Math.max(45, Math.min(105, camera.fov * factor));
        camera.updateProjectionMatrix();
      }
    });

    // 开启陀螺仪
    sensorBtn.addEventListener('click', () => {
      sensorBtn.style.display = 'none';
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    });

    function handleOrientation(event) {
      if (event.alpha !== null) {
        const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
        const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
        const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
        camera.rotation.set(beta, alpha, -gamma, 'YXZ');
      }
    }

    // 4. 文件加载与播放
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        fileName.textContent = file.name;
        video.play();
        playBtn.textContent = '❚❚ 暂停';
      }
    });

    playBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
        playBtn.textContent = '❚❚ 暂停';
      } else {
        video.pause();
        playBtn.textContent = '▶ 播放';
      }
    });

    // 5. 逐帧渲染与视线计算
    function animate() {
      requestAnimationFrame(animate);
      if (sensorBtn.style.display !== 'none') {
        // 未开启陀螺仪时使用触屏滑动视线
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3(
          500 * Math.sin(phi) * Math.cos(theta),
          500 * Math.cos(phi),
          500 * Math.sin(phi) * Math.sin(theta)
        );
        camera.lookAt(target);
      }
      renderer.render(scene, camera);
    }
    animate();

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>VR 180 缩放控制播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
    }
    .interactive { pointer-events: auto; }
    
    .btn {
      background: rgba(30, 30, 30, 0.85); color: #fff; padding: 8px 12px;
      border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.4); font-size: 12px;
      cursor: pointer; backdrop-filter: blur(8px);
      user-select: none;
    }
    .btn:active { background: rgba(80, 80, 80, 0.9); }

    #top-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    
    .slider-box {
      background: rgba(30, 30, 30, 0.85); padding: 4px 10px; border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 11px;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px);
    }

    #bottom-bar {
      background: rgba(30, 30, 30, 0.85); padding: 8px 12px; border-radius: 18px;
      color: #fff; font-size: 11px; display: flex; justify-content: space-between; align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="top-bar">
      <label class="btn interactive">
         选MP4
        <input type="file" id="video-file" accept="video/*" style="display:none;">
      </label>
      <button id="play-btn" class="btn interactive">▶ 播放</button>
      <button id="zoom-in-btn" class="btn interactive"> 放大</button>
      <button id="zoom-out-btn" class="btn interactive"> 缩小</button>
      <button id="flip-btn" class="btn interactive"> 旋转180°</button>
      <button id="sensor-btn" class="btn interactive">开启陀螺仪</button>
      <button id="reset-btn" class="btn interactive"> 重置视角</button>
      
      <div class="slider-box interactive">
        <span>距离</span>
        <input type="range" id="dist-slider" min="1.5" max="8" step="0.2" value="3.5">
      </div>
    </div>

    <div id="bottom-bar">
      <span id="status">状态: 请导入本地 MP4 视频</span>
    </div>
  </div>

  <div id="canvas-container"></div>
  
  <video id="video" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
  <canvas id="texture-canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const fileInput = document.getElementById('video-file');
    const playBtn = document.getElementById('play-btn');
    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const flipBtn = document.getElementById('flip-btn');
    const sensorBtn = document.getElementById('sensor-btn');
    const resetBtn = document.getElementById('reset-btn');
    const distSlider = document.getElementById('dist-slider');
    const statusText = document.getElementById('status');

    const textureCanvas = document.getElementById('texture-canvas');
    const ctx = textureCanvas.getContext('2d');

    // 1. 初始化 3D 场景
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    camera.position.set(0, 0, 0);

    // 2. 贴图与屏幕建网
    const texture = new THREE.CanvasTexture(textureCanvas);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    let screenMesh = null;
    let isFlipped = false;

    function buildScreen() {
      if (screenMesh) scene.remove(screenMesh);

      const vWidth = video.videoWidth || 1080;
      const vHeight = video.videoHeight || 1920;
      const aspect = vWidth / vHeight;

      const radius = parseFloat(distSlider.value);
      
      const arcAngle = Math.PI * 0.55; 
      const arcLength = radius * arcAngle;
      const height = arcLength / aspect;

      const geometry = new THREE.CylinderGeometry(
        radius, radius, height, 64, 1, true, -arcAngle / 2, arcAngle
      );
      geometry.scale(-1, 1, 1);

      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      screenMesh = new THREE.Mesh(geometry, material);

      screenMesh.rotation.y = Math.PI;
      if (isFlipped) screenMesh.rotation.z = Math.PI;

      scene.add(screenMesh);
    }

    // 3. 放大缩小视角逻辑
    zoomInBtn.addEventListener('click', () => {
      let currentVal = parseFloat(distSlider.value);
      currentVal = Math.max(parseFloat(distSlider.min), currentVal - 0.5); // 减小距离 = 放大视角
      distSlider.value = currentVal;
      buildScreen();
    });

    zoomOutBtn.addEventListener('click', () => {
      let currentVal = parseFloat(distSlider.value);
      currentVal = Math.min(parseFloat(distSlider.max), currentVal + 0.5); // 增大距离 = 缩小视角
      distSlider.value = currentVal;
      buildScreen();
    });

    distSlider.addEventListener('input', buildScreen);

    // 旋转翻转 180°
    flipBtn.addEventListener('click', () => {
      isFlipped = !isFlipped;
      if (screenMesh) screenMesh.rotation.z = isFlipped ? Math.PI : 0;
    });

    // 4. 视角交互与陀螺仪
    let lon = 0, lat = 0;
    let startX = 0, startY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lon -= deltaX * 0.25;
        lat += deltaY * 0.25;
        lat = Math.max(-85, Math.min(85, lat));
      }
    });

    resetBtn.addEventListener('click', () => {
      lon = 0;
      lat = 0;
      camera.rotation.set(0, 0, 0);
    });

    sensorBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusText.textContent = '状态: 陀螺仪已连接';
          }
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusText.textContent = '状态: 陀螺仪已连接';
      }
    });

    function handleOrientation(event) {
      if (event.alpha !== null) {
        const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
        const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
        const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
        camera.rotation.set(beta, alpha, -gamma, 'YXZ');
      }
    }

    // 5. 视频加载与播放
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        
        video.onloadedmetadata = () => {
          textureCanvas.width = video.videoWidth;
          textureCanvas.height = video.videoHeight;
          buildScreen();
        };

        video.play().then(() => {
          playBtn.textContent = '❚❚ 暂停';
          statusText.textContent = '状态: 正在播放 ' + file.name;
        }).catch(() => {
          statusText.textContent = '状态: 已就绪，请点击上方的【▶ 播放】';
        });
      }
    });

    playBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
        playBtn.textContent = '❚❚ 暂停';
      } else {
        video.pause();
        playBtn.textContent = '▶ 播放';
      }
    });

    // 6. 渲染循环
    function animate() {
      requestAnimationFrame(animate);
      
      if (video.readyState >= video.HAVE_CURRENT_DATA) {
        ctx.drawImage(video, 0, 0, textureCanvas.width, textureCanvas.height);
        texture.needsUpdate = true;
      }

      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

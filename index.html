<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>180°手机VR播放器</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#video{display:none}
#ui{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 10px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:linear-gradient(rgba(0,0,0,.65),transparent)}
button,label{border:0;border-radius:10px;background:rgba(30,30,30,.88);color:#fff;padding:9px 12px;font-size:14px}
button:active,label:active{background:rgba(80,80,80,.95)}
input{display:none}
#status{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;background:rgba(0,0,0,.65);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.45}
#hint{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:85%;text-align:center;color:#ddd;line-height:1.7}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%;opacity:.35;z-index:3;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<video id="video" playsinline webkit-playsinline preload="metadata"></video>
<canvas id="canvas"></canvas>
<div id="ui">
<label>选择MP4<input id="file" type="file" accept="video/*"></label>
<button id="play">播放</button>
<button id="gyro">启用陀螺仪</button>
<button id="center">居中</button>
<button id="full">全屏</button>
</div>
<div id="hint">请选择一个普通 MP4 视频</div>
<div id="cross"></div>
<div id="status">状态：等待视频　｜　陀螺仪：未启用</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const video=$("video"), canvas=$("canvas"), gl=canvas.getContext("webgl",{alpha:false,antialias:false});
const hint=$("hint"), status=$("status");
let objectURL=null, sensor=false, firstOrientation=true;
let yaw=0,pitch=0,drag=false,lastX=0,lastY=0;
let baseAlpha=0,baseBeta=0,baseGamma=0;

if(!gl){
  status.textContent="状态：此浏览器不支持 WebGL";
  throw new Error("WebGL unavailable");
}

/* ---------- WebGL：180°虚拟球面 ---------- */
const VS=`
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  gl_Position=vec4(aPos,0.0,1.0);
  vUv=aPos*0.5+0.5;
}`;
const FS=`
precision mediump float;
varying vec2 vUv;
uniform sampler2D uVideo;
uniform float uYaw;
uniform float uPitch;
uniform float uAspect;

const float PI=3.141592653589793;

void main(){
  /* 约90°垂直视场、180°水平视场的前向观察 */
  float hfov=PI;
  float x=(vUv.x-0.5)*2.0*tan(hfov*0.5);
  float y=(vUv.y-0.5)*2.0*tan(hfov*0.5)/uAspect;

  vec3 d=normalize(vec3(x,y,-1.0));

  /* yaw：左右 */
  float cy=cos(uYaw), sy=sin(uYaw);
  d=vec3(cy*d.x+sy*d.z,d.y,-sy*d.x+cy*d.z);

  /* pitch：上下 */
  float cp=cos(uPitch), sp=sin(uPitch);
  d=vec3(d.x,cp*d.y-sp*d.z,sp*d.y+cp*d.z);

  /* 只显示前方180° */
  float lon=atan(d.x,-d.z);
  if(abs(lon)>PI*0.5){
    gl_FragColor=vec4(0.0,0.0,0.0,1.0);
    return;
  }

  /*
   * 普通16:9视频作为180°内容。
   * 中心区域比例保持自然；左右边缘逐渐展开。
   */
  float u=0.5+lon/PI;
  float lat=asin(clamp(d.y,-1.0,1.0));
  float v=0.5-lat/PI;

  if(u<0.0||u>1.0||v<0.0||v>1.0){
    gl_FragColor=vec4(0.0,0.0,0.0,1.0);
    return;
  }

  /* WebGL纹理坐标与视频坐标翻转修正 */
  gl_FragColor=texture2D(uVideo,vec2(u,v));
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(program,"aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

const texture=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,texture);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

const uYaw=gl.getUniformLocation(program,"uYaw");
const uPitch=gl.getUniformLocation(program,"uPitch");
const uAspect=gl.getUniformLocation(program,"uAspect");

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*d);
  canvas.height=Math.round(innerHeight*d);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize,{passive:true}); resize();

function render(){
  requestAnimationFrame(render);
  if(video.readyState<2) return;
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  try{
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }catch(e){return}
  gl.uniform1f(uYaw,yaw);
  gl.uniform1f(uPitch,pitch);
  gl.uniform1f(uAspect,canvas.width/canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
render();

/* ---------- 视频 ---------- */
$("file").addEventListener("change",()=>{
  const f=$("file").files[0];
  if(!f)return;
  if(objectURL)URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(f);
  video.src=objectURL;
  video.load();
  hint.textContent="视频已载入，点击“播放”";
  status.textContent="状态：视频已载入　｜　陀螺仪："+(sensor?"已连接":"未启用");
});
$("play").addEventListener("click",async()=>{
  if(!video.src){hint.textContent="请先选择视频";return}
  try{
    await video.play();
    hint.style.display="none";
  }catch(e){
    hint.textContent="无法播放："+e.message;
  }
});

/* ---------- 陀螺仪 ---------- */
function setStatus(s){
  status.textContent="状态："+(video.src?"视频已载入":"等待视频")+"　｜　陀螺仪："+s;
}

function orientation(e){
  if(e.alpha==null || e.beta==null) return;
  if(firstOrientation){
    baseAlpha=e.alpha||0;
    baseBeta=e.beta||0;
    baseGamma=e.gamma||0;
    firstOrientation=false;
  }

  /*
   * 不直接把绝对角度塞给yaw，避免第一次启用时画面跳走。
   * alpha主要负责左右旋转；beta负责上下。
   */
  let da=(e.alpha||0)-baseAlpha;
  while(da>180)da-=360;
  while(da<-180)da+=360;

  let db=(e.beta||0)-baseBeta;

  /* 手机竖屏持握时，左右转动映射为yaw */
  yaw=da*Math.PI/180;
  pitch=Math.max(-Math.PI/3,Math.min(Math.PI/3,-db*Math.PI/180));

  sensor=true;
  setStatus("已连接");
}

async function enableGyro(){
  try{
    if(!("DeviceOrientationEvent" in window)){
      setStatus("此浏览器不支持");
      return;
    }

    /*
     * iOS/Safari等浏览器需要在用户点击事件中申请权限。
     * 非HTTPS页面无法可靠获得传感器权限。
     */
    const secure=location.protocol==="https:" ||
                 location.hostname==="localhost" ||
                 location.hostname==="127.0.0.1";

    if(!secure){
      setStatus("被浏览器禁止：请用 HTTPS 地址打开本页面");
      return;
    }

    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const result=await DeviceOrientationEvent.requestPermission();
      if(result!=="granted"){
        setStatus("权限被拒绝，请在浏览器设置中允许运动与方向访问");
        return;
      }
    }

    firstOrientation=true;
    window.addEventListener("deviceorientation",orientation,true);
    window.addEventListener("deviceorientationabsolute",orientation,true);

    /* 某些Android浏览器首次需要先收到一次事件 */
    setStatus("等待传感器…");

    setTimeout(()=>{
      if(!sensor) setStatus("未收到传感器数据：检查浏览器的运动传感器权限");
    },2000);

  }catch(err){
    setStatus("被禁止或不可用");
  }
}

$("gyro").addEventListener("click",enableGyro);

$("center").addEventListener("click",()=>{
  yaw=0; pitch=0; firstOrientation=true;
  if(sensor)setStatus("已连接");
});

$("full").addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){
    /* iOS Safari可能不支持标准Fullscreen，忽略即可 */
  }
});

/* ---------- 手指拖动备用控制 ---------- */
canvas.addEventListener("pointerdown",e=>{
  drag=true; lastX=e.clientX; lastY=e.clientY;
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointercancel",()=>drag=false);
canvas.addEventListener("pointermove",e=>{
  if(!drag)return;
  yaw-=(e.clientX-lastX)*0.006;
  pitch-= (e.clientY-lastY)*0.006;
  pitch=Math.max(-Math.PI/3,Math.min(Math.PI/3,pitch));
  lastX=e.clientX; lastY=e.clientY;
});
</script>
</body>
</html>

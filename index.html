<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>VR 巨幕防变形播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: sans-serif; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
    }
    .interactive { pointer-events: auto; }
    
    .btn {
      background: rgba(20, 20, 20, 0.85); color: #fff; padding: 8px 12px;
      border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.3); font-size: 12px;
      cursor: pointer; backdrop-filter: blur(8px);
    }

    #top-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    
    .slider-box {
      background: rgba(20, 20, 20, 0.85); padding: 4px 10px; border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 11px;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px);
    }

    #bottom-bar {
      background: rgba(20, 20, 20, 0.85); padding: 8px 12px; border-radius: 18px;
      color: #fff; font-size: 11px; display: flex; justify-content: space-between; align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="top-bar">
      <label class="btn interactive">
         选MP4
        <input type="file" id="video-file" accept="video/*" style="display:none;">
      </label>
      <button id="play-btn" class="btn interactive">▶ 播放</button>
      <button id="sensor-btn" class="btn interactive">开启陀螺仪</button>
      <button id="reset-btn" class="btn interactive"> 重置视角</button>
      
      <div class="slider-box interactive">
        <span>屏幕距离</span>
        <input type="range" id="dist-slider" min="3" max="15" step="0.5" value="6">
      </div>
    </div>

    <div id="bottom-bar">
      <span id="status">状态: 请导入本地 MP4 视频</span>
    </div>
  </div>

  <div id="canvas-container"></div>
  <video id="video" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

  <script>
    const video = document.getElementById('video');
    const fileInput = document.getElementById('video-file');
    const playBtn = document.getElementById('play-btn');
    const sensorBtn = document.getElementById('sensor-btn');
    const resetBtn = document.getElementById('reset-btn');
    const distSlider = document.getElementById('dist-slider');
    const statusText = document.getElementById('status');

    // 1. 初始化 3D 渲染环境
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    camera.position.set(0, 0, 0);

    // 2. 动态比例曲面大屏 (贴合视频原比例，确保零变形)
    let screenMesh = null;
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    function buildScreen() {
      if (screenMesh) scene.remove(screenMesh);

      // 获取视频原始分辨率和长宽比
      const vWidth = video.videoWidth || 1920;
      const vHeight = video.videoHeight || 1080;
      const aspect = vWidth / vHeight;

      // 依据真实比例生成微弯曲巨幕（弧度 60 度，符合最佳人眼环绕感）
      const radius = parseFloat(distSlider.value);
      const thetaLength = Math.PI / 3; // 60度弧长
      const height = (radius * thetaLength) / aspect; // 按照真实比例严格计算高度

      const geometry = new THREE.CylinderGeometry(
        radius, radius, height, 64, 1, true, -thetaLength / 2, thetaLength
      );
      geometry.scale(-1, 1, 1); // 内侧渲染

      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      screenMesh = new THREE.Mesh(geometry, material);
      
      // 保证视频正面朝向相机
      screenMesh.rotation.y = Math.PI;
      scene.add(screenMesh);
    }

    // 初始创建一个默认屏幕
    buildScreen();

    // 3. 调节屏幕距离
    distSlider.addEventListener('input', () => {
      buildScreen();
    });

    // 4. 视角拖拽与陀螺仪
    let lon = 0, lat = 0;
    let startX = 0, startY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lon -= deltaX * 0.25;
        lat += deltaY * 0.25;
        lat = Math.max(-85, Math.min(85, lat));
      }
    });

    resetBtn.addEventListener('click', () => {
      lon = 0;
      lat = 0;
      camera.rotation.set(0, 0, 0);
    });

    sensorBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusText.textContent = '状态: 陀螺仪已连接';
          }
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusText.textContent = '状态: 陀螺仪已连接';
      }
    });

    function handleOrientation(event) {
      if (event.alpha !== null) {
        const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
        const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
        const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
        camera.rotation.set(beta, alpha, -gamma, 'YXZ');
      }
    }

    // 5. 视频加载并重新匹配宽高比
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = () => {
          buildScreen(); // 加载视频后重新根据像素比例渲染
        };
        video.play();
        playBtn.textContent = '❚❚ 暂停';
        statusText.textContent = '状态: 正在播放 ' + file.name;
      }
    });

    playBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
        playBtn.textContent = '❚❚ 暂停';
      } else {
        video.pause();
        playBtn.textContent = '▶ 播放';
      }
    });

    // 6. 逐帧渲染
    function animate() {
      requestAnimationFrame(animate);
      
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
